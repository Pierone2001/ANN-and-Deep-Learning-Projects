# Data augmentation configuration

# Rotation
use_rotation: true
rotation_degrees: 360  # Full rotation range
rotation_90deg_only: false  # If true, only 90-degree increments

# Flips
use_flip_horizontal: true
use_flip_vertical: true

# Color jitter
use_color_jitter: true
color_jitter_brightness: 0.2
color_jitter_contrast: 0.2
color_jitter_saturation: 0.1
color_jitter_hue: 0.05

# Gaussian noise
use_gaussian_noise: false
noise_std: 0.01

# Gaussian blur
use_gaussian_blur: false
blur_kernel_size: 3
blur_sigma: [0.1, 2.0]

# Normalization
use_normalize: true
normalize_mean: [0.485, 0.456, 0.406]  # ImageNet stats
normalize_std: [0.229, 0.224, 0.225]  # ImageNet stats

